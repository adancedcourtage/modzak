<style>
.intro{padding:150px var(--pad) 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end;max-width:1440px;margin:auto}
.intro h1{font-size:clamp(64px,10vw,170px)}
.intro h1 .sig{display:block;font-size:.5em;color:var(--olive-deep)}
@media(max-width:860px){.intro{grid-template-columns:1fr;padding-top:120px}}

.bar{position:sticky;top:76px;z-index:20;background:var(--paper);border-block:1px solid var(--ink);transition:top .5s var(--ease)}
.hd-hidden .bar{top:0}
.bar .wrap{display:flex;align-items:center;gap:20px;justify-content:space-between;min-height:64px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;transition:color .3s}
.tabs button[aria-pressed=true]{color:var(--paper)}
.tabs .ink{position:absolute;top:0;bottom:0;left:0;background:var(--ink);transition:transform .5s var(--ease),width .5s var(--ease)}
.tabs sup{font-size:10px;margin-inline-start:3px;opacity:.6}
.find{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);min-width:220px}
.find input{border:0;background:none;padding:8px 0;font-size:14px;width:100%}
@media(max-width:700px){.bar .wrap{flex-direction:column;align-items:stretch;gap:8px;padding-block:10px}.find{min-width:0}}

.catalog{padding:44px var(--pad) 120px;max-width:1440px;margin:auto}
.product.out{display:none}
.bar .subfilters{justify-content:flex-start;min-height:0;gap:8px;padding-block:10px;overflow-x:auto}
.bar .subfilters[hidden],.more[hidden]{display:none}
.subfilters button{flex-shrink:0;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.subfilters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.more{display:block;margin:36px auto 0;border:1px solid var(--ink);padding:14px 28px}
@media(max-width:700px){.bar .subfilters{flex-direction:row;align-items:center}}

.none{padding:60px 0;font-size:18px;color:var(--muted)}
.none button{color:var(--ink);text-decoration:underline}

.help{background:var(--olive);border-block:1px solid var(--ink);padding:clamp(50px,7vw,90px) 0}
.help .wrap{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.help h2{font-size:clamp(38px,5vw,74px);max-width:16ch}
</style>

<body data-page="collection">
<main>
  <section class="intro">

    <p class="lead" data-fr="Touchez une photo pour voir la pièce et choisir votre taille. Le cœur l’ajoute à votre sélection, que vous envoyez en un message WhatsApp." data-ar="اضغط على الصورة لرؤية القطعة واختيار مقاسك. القلب يضيفها إلى اختياراتك التي ترسلها في رسالة واتساب واحدة.">Touchez une photo pour voir la pièce et choisir votre taille. Le cœur l’ajoute à votre sélection, que vous envoyez en un message WhatsApp.</p>

  <div class="bar"><div class="wrap">

    <label class="find"><span class="sr" data-fr="Rechercher une pièce" data-ar="ابحث عن قطعة">Rechercher une pièce</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m11 11 4 4" stroke="currentColor" stroke-width="1.5"/></svg><input id="q" type="search" data-ph-fr="Smoking, chemise, sandales…" data-ph-ar="سموكينغ، قميص، صندل…" placeholder="Smoking, chemise, sandales…"></label>
  </div><div class="subfilters wrap" id="subfilters" role="group" aria-label="Sous-catégories" data-al-fr="Sous-catégories" data-al-ar="الفئات الفرعية" hidden></div></div>

  <section class="catalog">
    <h2 class="sr" data-fr="Les pièces" data-ar="القطع">Les pièces</h2>
    <div class="products" id="grid" aria-live="polite"></div>
    <button class="more" id="more" type="button" hidden></button>
    <p class="none" id="none" hidden></p>
  </section>

  <section class="help"><div class="wrap">

  </div></section>
