<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection · Modzak Mohammedia</title>
<meta name="description" content="Costumes, smokings, chemises, polos, pantalons et chaussures homme chez Modzak à Mohammedia. Choisissez votre taille et commandez sur WhatsApp.">
<meta name="theme-color" content="#f3efe5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.intro{padding:150px var(--pad) 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end;max-width:1440px;margin:auto}
.intro h1{font-size:clamp(64px,10vw,170px)}
.intro h1 .sig{display:block;font-size:.5em;color:var(--olive-deep)}
@media(max-width:860px){.intro{grid-template-columns:1fr;padding-top:120px}}

.bar{position:sticky;top:76px;z-index:20;background:var(--paper);border-block:1px solid var(--ink);transition:top .5s var(--ease)}
.hd-hidden .bar{top:0}
.bar .wrap{display:flex;align-items:center;gap:20px;justify-content:space-between;min-height:64px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;transition:color .3s}
.tabs button[aria-pressed=true]{color:var(--paper)}
.tabs .ink{position:absolute;top:0;bottom:0;left:0;background:var(--ink);transition:transform .5s var(--ease),width .5s var(--ease)}
.tabs sup{font-size:10px;margin-inline-start:3px;opacity:.6}
.find{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);min-width:220px}
.find input{border:0;background:none;padding:8px 0;font-size:14px;width:100%}
@media(max-width:700px){.bar .wrap{flex-direction:column;align-items:stretch;gap:8px;padding-block:10px}.find{min-width:0}}

.catalog{padding:44px var(--pad) 120px;max-width:1440px;margin:auto}
.product.out{display:none}
.none{padding:60px 0;font-size:18px;color:var(--muted)}
.none button{color:var(--ink);text-decoration:underline}

.help{background:var(--olive);border-block:1px solid var(--ink);padding:clamp(50px,7vw,90px) 0}
.help .wrap{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.help h2{font-size:clamp(38px,5vw,74px);max-width:16ch}
</style>
</head>
<body data-page="collection">
<main>
  <section class="intro">
    <h1 class="display" data-split data-fr="La collection <span class='sig'>du vestiaire masculin</span>" data-ar="المجموعة <span class='sig'>لخزانة الرجل</span>">La collection <span class="sig">du vestiaire masculin</span></h1>
    <p class="lead" data-fr="Touchez une photo pour voir la pièce et choisir votre taille. Le cœur l’ajoute à votre sélection, que vous envoyez en un message WhatsApp." data-ar="اضغط على الصورة لرؤية القطعة واختيار مقاسك. القلب يضيفها إلى اختياراتك التي ترسلها في رسالة واتساب واحدة.">Touchez une photo pour voir la pièce et choisir votre taille. Le cœur l’ajoute à votre sélection, que vous envoyez en un message WhatsApp.</p>
  </section>

  <div class="bar"><div class="wrap">
    <div class="tabs" id="tabs" role="group" aria-label="Catégories"><span class="ink" id="ink"></span></div>
    <label class="find"><span class="sr" data-fr="Rechercher une pièce" data-ar="ابحث عن قطعة">Rechercher une pièce</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m11 11 4 4" stroke="currentColor" stroke-width="1.5"/></svg><input id="q" type="search" data-ph-fr="Smoking, chemise, sandales…" data-ph-ar="سموكينغ، قميص، صندل…" placeholder="Smoking, chemise, sandales…"></label>
  </div></div>

  <section class="catalog">
    <div class="products" id="grid" aria-live="polite"></div>
    <p class="none" id="none" hidden></p>
  </section>

  <section class="help"><div class="wrap">
    <h2 class="display" data-fr="Vous ne trouvez pas votre pièce ?" data-ar="لم تجد القطعة التي تبحث عنها؟">Vous ne trouvez pas votre pièce ?</h2>
    <a class="btn" data-magnet target="_blank" rel="noopener" href="https://wa.me/212629942924?text=Bonjour%20Modzak%2C%20je%20cherche%20%3A%20" data-fr="Décrivez-la sur WhatsApp" data-ar="صِفها لنا عبر واتساب">Décrivez-la sur WhatsApp</a>
  </div></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/site.js"></script>
<script>
(() => {
const { PRODUCTS, CATS, card, t } = MZ;
const grid = document.getElementById('grid'), tabs = document.getElementById('tabs'), ink = document.getElementById('ink'), q = document.getElementById('q'), none = document.getElementById('none');
let cat = new URLSearchParams(location.search).get('c') || 'all', term = '';
if (!CATS[cat]) cat = 'all';

function drawTabs() {
  tabs.querySelectorAll('button').forEach(b => b.remove());
  Object.keys(CATS).forEach(k => {
    const n = k === 'all' ? PRODUCTS.length : PRODUCTS.filter(p => p.cat === k).length;
    tabs.insertAdjacentHTML('beforeend', `<button data-c="${k}" aria-pressed="${k === cat}">${CATS[k][MZ.lang() === 'ar' ? 1 : 0]}<sup>${n}</sup></button>`);
  });
  moveInk();
}
function moveInk() {
  const b = tabs.querySelector(`[data-c="${cat}"]`); if (!b) return;
  ink.style.width = b.offsetWidth + 'px'; ink.style.transform = `translateX(${b.offsetLeft}px)`;
}
function drawGrid() { grid.innerHTML = PRODUCTS.map(card).join(''); filter(false) }

/* filtre animé : chaque carte glisse de son ancienne place à la nouvelle */
function filter(animate = true) {
  const cards = [...grid.children];
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  const s = term.trim().toLowerCase();
  let shown = 0;
  cards.forEach(c => {
    const p = PRODUCTS.find(x => x.id === c.dataset.id);
    const ok = (cat === 'all' || p.cat === cat) && (!s || (p.fr + ' ' + p.ar + ' ' + p.cat).toLowerCase().includes(s));
    c.classList.toggle('out', !ok); if (ok) shown++;
  });
  none.hidden = shown > 0;
  if (!shown) { none.textContent = `${t('Aucune pièce ne correspond à','لا توجد قطعة تطابق')} « ${term} ». `; none.insertAdjacentHTML('beforeend', `<button id="reset">${t('Tout afficher','عرض الكل')}</button>`) }
  if (!animate || MZ.reduce || !window.gsap) return;
  cards.filter(c => !c.classList.contains('out')).forEach((c, i) => {
    const a = before.get(c), b = c.getBoundingClientRect();
    if (a.width === 0) gsap.fromTo(c, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .6, delay: i * .04, ease: 'power3.out', clearProps: 'all' });
    else gsap.fromTo(c, { x: a.left - b.left, y: a.top - b.top }, { x: 0, y: 0, duration: .7, ease: 'power3.inOut', clearProps: 'transform' });
  });
}

tabs.addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  cat = b.dataset.c; tabs.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); moveInk(); filter();
  history.replaceState(null, '', cat === 'all' ? location.pathname : `?c=${cat}`);
});
let timer; q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { term = q.value; filter() }, 160) });
none.addEventListener('click', e => { if (e.target.id === 'reset') { term = ''; q.value = ''; cat = 'all'; drawTabs(); filter() } });
addEventListener('resize', moveInk);
document.addEventListener('mz:lang', () => { drawTabs(); drawGrid() });

/* la barre de filtres remonte quand l'en-tête se cache */
addEventListener('scroll', () => document.body.classList.toggle('hd-hidden', !!document.querySelector('.hd.hide')), { passive: true });

drawTabs(); drawGrid();
document.fonts?.ready.then(moveInk);
})();
</script>
</body>
</html>
